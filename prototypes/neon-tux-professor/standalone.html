      const f=Math.min(1,(time-s.t0)/(s.t1-s.t0 || 1)), p=s.from.map((v,k)=>v+f*(s.to[k]-v));
      d+=`M${s.from}L${p}`;
    }
    this.chalk.setAttribute('d',d);
    [...this.fallback.children].forEach((el,i)=>el.setAttribute('visibility',time >= this.timeline.fallbacks[i].at ? 'visible':'hidden'));
    const pose=sample.pose;
    for (const el of [this.links,this.pen,this.target,...this.joints]) el.setAttribute('visibility',pose?'visible':'hidden');
    if (!pose) return sample;
    this.links.setAttribute('d',`M${pose.shoulder}L${pose.elbow}L${pose.wrist}`);
    [pose.shoulder,pose.elbow,pose.wrist].forEach((p,i)=>{this.joints[i].setAttribute('cx',p[0]);this.joints[i].setAttribute('cy',p[1]);});
    for (const [key,value] of Object.entries({x1:pose.wrist[0],y1:pose.wrist[1],x2:pose.tip[0],y2:pose.tip[1]})) this.pen.setAttribute(key,value);
    this.pen.setAttribute('opacity',sample.chalkDown ? 1 : .45);
    this.target.setAttribute('cx',sample.point[0]);this.target.setAttribute('cy',sample.point[1]);
    this.target.setAttribute('visibility',pose.reachable?'hidden':'visible');
    return sample;
  }
  destroy() { this.group.replaceChildren(); }
}

/** onFrame receives world geometry; the consumer owns artwork and time. */
function createProfessorDriver(json, config, onFrame) {
  const timeline = compileTimeline(json);
  let arm = configureArm(config);
  if (typeof onFrame !== 'function') throw new TypeError('onFrame callback required');
  return {
    duration: timeline.duration,
    setArm(config) { arm = configureArm(config); },
    update(elapsedMs) { const state = sampleArm(timeline, elapsedMs, arm); onFrame(state); return state; }
  };
}

// Character motion owns no drawing geometry or symbolic mathematics.
function characterAt(time, scene, writingEnd) {
  const {walk, turn, react, returnWalk} = scene.timing;
  const target = scene.character.position;
  const lerp = (a,b,f) => a+(b-a)*Math.max(0,Math.min(1,f));
  let phase = 'walk', x = lerp(scene.startX,target[0],time/walk), facing=1, yaw=0;
  if(time>=walk){phase='turn'; x=target[0]; yaw=Math.min(1,(time-walk)/turn);}
  if(time>=walk+turn) phase='write';
  if(time>=writingEnd){phase='react'; yaw=1-Math.min(1,(time-writingEnd)/react);}
  if(time>=writingEnd+react){phase='return'; facing=-1; yaw=0; x=lerp(target[0],scene.startX,(time-writingEnd-react)/returnWalk);}
  if(time>=writingEnd+react+returnWalk){phase='complete';facing=1;}
  const moving=phase==='walk'||phase==='return';
  return {phase,x,y:target[1]+(moving?Math.sin(time/90)*3:phase==='react'?-Math.sin(Math.min(1,(time-writingEnd)/react)*Math.PI)*12:0),facing,yaw,step:moving?Math.sin(time/90)*10:0};
}
function armConfig(scene) {
  const c=scene.character, s=c.scale;
  return {...c.arm, shoulder:c.shoulder.map((v,i)=>c.position[i]+v*s), upper:c.arm.upper*s, forearm:c.arm.forearm*s, tip:c.arm.tip*s};
}

function createLesson(scene,json,onFrame=()=>{}) {
  const driver=createProfessorDriver(json,armConfig(scene),()=>{});
  const writingStart=scene.timing.walk+scene.timing.turn;
  const writingEnd=writingStart+driver.duration;
  const duration=writingEnd+scene.timing.react+scene.timing.returnWalk;
  return {duration,writingStart,writingEnd,driver,frame(time){
    if(!Number.isFinite(time)) throw new TypeError('Finite clock required');
    time=Math.max(0,Math.min(duration,time));
    const arm=driver.update(time-writingStart);
    const motion=characterAt(time,scene,writingEnd);
    const frame={time,motion,arm,writingTime:time-writingStart,writingStart,writingEnd,duration};
    onFrame(frame);return frame;
  }};
}

const VIEW_NS='http://www.w3.org/2000/svg';
function createView(svg,scene,json,art) {
  svg.innerHTML=`<defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="bodyClip"><rect width="100" height="181"/></clipPath></defs>
  <rect width="1000" height="620" fill="#080f1e"/>
  <path d="M0 555H1000" stroke="#294158"/><ellipse cx="450" cy="570" rx="360" ry="20" fill="#050b14"/>
  <path d="M570 400L520 568M800 400L860 568" stroke="#52616a" stroke-width="9"/>
  <rect x="490" y="150" width="410" height="285" rx="8" fill="#182f30" stroke="#778580" stroke-width="6"/>
  <text x="520" y="195" fill="#9bb6aa" font-family="DejaVu Sans, sans-serif" font-size="14" letter-spacing="3">TODAY’S LITTLE DISCOVERY</text>
  <path d="M520 215H865" stroke="#3a5650"/>
  <text x="520" y="260" fill="#dce8d8" font-size="23" font-family="DejaVu Serif, serif">Two and three make…</text>
  <path d="M480 438H912" stroke="#9ba19a" stroke-width="9"/>
  <g id="ink"></g><g id="actor"><g id="art">${art}</g><path id="feet" fill="none" stroke="#85bcff" stroke-width="3" filter="url(#glow)"/></g><g id="writing"></g>`;
  const ink=svg.querySelector('#ink'), g=svg.querySelector('#writing');
  const renderer=new SVGArmRenderer(ink,compileTimeline(json),configureArm(armConfig(scene)),{color:'#69a5ff'});
  // Existing engine owns cumulative reachable chalk geometry; character view owns limb artwork.
  for(const el of [renderer.links,renderer.pen,renderer.target,...renderer.joints])g.append(el);
  renderer.links.setAttribute('stroke-width','12');renderer.links.setAttribute('filter','url(#glow)');
  renderer.joints.forEach(el=>el.setAttribute('visibility','hidden'));
  const highlight=document.createElementNS(VIEW_NS,'path');highlight.setAttribute('fill','none');highlight.setAttribute('stroke','#d6efff');highlight.setAttribute('stroke-width','3');highlight.setAttribute('stroke-linejoin','round');highlight.setAttribute('stroke-linecap','round');g.append(highlight);
  const actor=svg.querySelector('#actor'), artwork=svg.querySelector('#art');
  const imported=artwork.querySelector('svg'); imported.setAttribute('width','148');imported.setAttribute('height','181');
  return {renderer,render(frame){
    const {motion:m}=frame, c=scene.character, writing=m.phase==='write';
    actor.setAttribute('transform',`translate(${m.x} ${m.y}) scale(${c.scale})`);
    artwork.setAttribute('transform',`translate(74 0) scale(${m.facing*(1-.18*m.yaw)} 1) translate(-74 0)`);
    imported.setAttribute('clip-path',writing?'url(#bodyClip)':'none');
    svg.querySelector('#feet').setAttribute('d',`M30 141l-10 ${10+m.step/3}h30 M85 139l-5 ${10-m.step/3}h28`);
    renderer.render(Math.max(-1,frame.writingTime));
    highlight.setAttribute('d',renderer.links.getAttribute('d')||'');
    renderer.joints.forEach(el=>el.setAttribute('visibility','hidden'));
    g.setAttribute('display',writing?'inline':'none');
    const incomplete=frame.arm.pose&&!frame.arm.pose.reachable&&frame.arm.penDown;
    return incomplete;
  }};
}

async function start(){
 const bundled=globalThis.PROFESSOR_DATA;
 const [scene,json,art]=bundled?[bundled.scene,bundled.timeline,bundled.art]:await Promise.all([fetch('./examples/scene.json').then(r=>r.json()),fetch('./examples/equation.json').then(r=>r.json()),fetch('./assets/blue-neon-tux.svg').then(r=>r.text())]);
 const profile=Object.hasOwn(scene.profiles,location.hash.slice(1))?location.hash.slice(1):'original';
 scene.character={...scene.character,...scene.profiles[profile]};
 document.querySelector('#profile').value=profile;
 const svg=document.querySelector('svg'),view=createView(svg,scene,json,art);
 let lesson=createLesson(scene,json),time=0,playing=false,last=null;
 const play=document.querySelector('#play'),seek=document.querySelector('#seek'),status=document.querySelector('#status');
 seek.max=lesson.duration;
 function render(){const frame=lesson.frame(time),unreachable=view.render(frame); seek.value=time;
 const labels={walk:'On my way to the board.',turn:'Let’s take a closer look.',write:'2 + 3 = 5 · Follow the chalk.',react:'There it is! Two plus three makes five.',return:'Your turn to try.',complete:'Lesson complete. Shall we do that again?'};
 status.textContent=unreachable?'Chalk lifted: point outside this character’s reach.':labels[frame.motion.phase];
 document.querySelector('#phase').textContent=frame.motion.phase;
 document.querySelector('#clock').textContent=(time/1000).toFixed(1)+' / '+(lesson.duration/1000).toFixed(1)+' s';
 play.textContent=playing?'Pause lesson':time>=lesson.duration?'Replay lesson':'Play lesson';}
 play.onclick=()=>{if(time>=lesson.duration)time=0;playing=!playing;last=null;render();};
 document.querySelector('#restart').onclick=()=>{time=0;playing=false;last=null;render();};
 seek.oninput=()=>{time=Number(seek.value);last=null;render();};
 document.querySelector('#profile').onchange=e=>{location.hash=e.target.value;location.reload();};
 function tick(now){if(playing){if(last!==null)time=Math.min(lesson.duration,time+(now-last)*Number(document.querySelector('#speed').value));last=now;if(time===lesson.duration)playing=false;render();}requestAnimationFrame(tick);}
 render();requestAnimationFrame(tick);
 globalThis.professor={lesson,seek(t){time=t;render();},scene};
}
start().catch(e=>{document.querySelector('#status').textContent='Unable to load the lesson: '+e.message;console.error(e);});

</script></body></html>
