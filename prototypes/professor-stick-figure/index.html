<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Professor B1.6 · Development tool</title><meta name="description" content="Development prototype with anatomical arms, reach-driven horizontal movement and curved SVG limbs."><link rel="stylesheet" href="style.css"></head>
<body><main>
<div class="experiment"><section class="stage" aria-label="Professor writing demonstration">
<div class="stage-heading"><span><i></i> REAR THREE-QUARTER VIEW</span><span>FACING SCREEN-RIGHT →</span></div>
<svg id="scene" viewBox="0 0 960 570" role="img" aria-label="Rear-facing figure repositioning horizontally to write with a short right arm at fixed board coordinates">
<defs><pattern id="board-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#cfdec9" stroke-opacity=".055"/></pattern></defs>
<path d="M95 510H905" stroke="#66746a" stroke-width="1"/>
<rect x="310" y="75" width="590" height="300" rx="7" fill="#574b38"/><rect x="320" y="85" width="570" height="280" rx="4" fill="#17392e"/><rect x="320" y="85" width="570" height="280" rx="4" fill="url(#board-grid)"/>
<path d="M314 378H905" stroke="#857054" stroke-width="7" stroke-linecap="round"/><path d="M355 166H855M355 210H855" stroke="#d2dec9" stroke-opacity=".1" stroke-dasharray="3 6"/>
<text x="343" y="109" fill="#94b2a0" font-family="monospace" font-size="9" letter-spacing="2">BOARD / WORLD SPACE</text>
<g id="professor"></g>
<g id="board-anchor" visibility="hidden" pointer-events="none"><circle cx="355" cy="140" r="7" fill="none" stroke="#8dbca7"/><text x="365" y="130" fill="#a5c9b8" font-family="monospace" font-size="11">board origin</text></g>
<text x="124" y="551" fill="#9bada2" font-family="monospace" font-size="10" letter-spacing="1">STEPPING GAIT · CHALK LIFTED WHILE WALKING</text>
</svg>
<div class="transport"><button id="play" class="primary">Play</button><button id="reset">Reset</button><label class="scrubber">Timeline<input id="seek" type="range" step="any" min="0" max="1" value="0" aria-label="Timeline position"></label><output id="clock">0.0 / 0.0 s</output><label class="speed-label">Speed<select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div>
<div class="stage-footer"><span id="contact" role="status">Ready</span><label><input id="anchors" type="checkbox"> Show skeleton / anchors</label></div>
</section><aside><p class="eyebrow">B1.6 / WRITING TOOL</p><label for="math-example">Problem</label><select id="math-example" aria-label="Math problem"><option value="example">Example: x/5-4/4=2/5</option><option value="generated-0">Generated addition</option><option value="generated-1">Generated subtraction</option><option value="generated-2">Generated multiplication</option><option value="free">Free writing</option></select><label for="writing">Equation / writing instructions</label><textarea id="writing" rows="2" spellcheck="false">x/5-4/4=2/5</textarea><button id="load" class="primary wide">Solve &amp; write ↗</button><p id="message" role="status"></p><p id="operation" role="status"></p><div class="file-actions"><button id="export">Export JSON ↓</button><label for="import" class="file-label">Import JSON<input id="import" type="file" accept=".json,application/json"></label></div>
<details id="advanced"><summary>Advanced / Body Rig</summary><div id="body-controls" class="body-controls"></div><dl><dt>Upper / forearm</dt><dd id="arm-lengths"></dd><dt>Right shoulder</dt><dd id="shoulder-value"></dd><dt>Body origin</dt><dd id="body-origin"></dd></dl><button id="restore" class="wide">Restore body rig</button></details><p class="docs"><a href="README.md">Docs</a> · <a href="docs/coordinates.md">Rig / motion contract</a></p></aside></div>
</main><script type="module" src="demo.js"></script></body></html>
